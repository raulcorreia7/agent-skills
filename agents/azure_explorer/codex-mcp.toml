# Merge into ~/.codex/config.toml. Codex agents cannot declare MCP servers,
# so these servers reach every session; each one exposes read tools only.

[mcp_servers.azure]
command = "npx"
args = [
  "-y", "@azure/mcp@3.0.0", "server", "start", "--read-only",
  "--namespace", "subscription", "--namespace", "group", "--namespace", "role",
  "--namespace", "policy", "--namespace", "advisor", "--namespace", "resourcehealth",
  "--namespace", "quota", "--namespace", "monitor", "--namespace", "applicationinsights",
  "--namespace", "compute", "--namespace", "aks", "--namespace", "acr",
  "--namespace", "containerapps", "--namespace", "appservice", "--namespace", "functionapp",
  "--namespace", "sql", "--namespace", "redis", "--namespace", "servicebus",
  "--namespace", "eventhubs", "--namespace", "eventgrid", "--namespace", "signalr",
]
env = { AZURE_TOKEN_CREDENTIALS = "AzureCliCredential" }

[mcp_servers.azure_devops]
command = "sh"
args = [
  "-c",
  'exec npx -y @azure-devops/mcp@2.11.0 "$AZURE_DEVOPS_ORG" --authentication azcli -d core work work-items repositories pipelines wiki search advanced-security test-plans',
]
env_vars = ["AZURE_DEVOPS_ORG"]
enabled_tools = [
  "core_list_projects", "core_list_project_teams", "core_get_identity_ids",
  "work", "wit_work_item", "wit_query",
  "repo_repository", "repo_branch", "repo_file", "repo_search_commits",
  "repo_pull_request", "repo_pull_request_org", "repo_pull_request_thread",
  "pipelines_build", "pipelines_build_log", "pipelines_definition", "pipelines_run",
  "testplan", "testplan_show_test_results_from_build_id",
  "wiki", "search_code", "search_wiki", "search_workitem",
  "advsec_get_alerts", "advsec_get_alert_details",
]
